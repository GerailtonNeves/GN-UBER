<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>99 Super-App - Aplicativo do Passageiro</title>
  
  <link rel="icon" type="image/jpeg" href="assets/icon_passageiro.jpg" />
  <link rel="apple-touch-icon" href="assets/icon_passageiro.jpg" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.0">
</head>
<body>

  <div id="toastContainer" class="toast-container"></div>

  <header class="app-header">
    <div class="logo">
      <div class="logo-icon-wrap"><i class="fa-solid fa-car-side logo-icon"></i></div>
      <div class="logo-text">
        <span>99<strong>SUPER-APP</strong></span>
        <small class="version">📱 APP DO PASSAGEIRO & ENTREGAS 99</small>
      </div>
      <span class="badge-live"><i class="fa-solid fa-circle blink"></i> 99 POP & MOTO</span>
    </div>

    <nav class="mode-tabs">
      <a href="index.html" class="tab-btn"><i class="fa-solid fa-house" style="color: #ff9e00;"></i> Portal Principal</a>
      <a href="motorista.html" class="tab-btn"><i class="fa-solid fa-taxi" style="color: #ff9e00;"></i> App Motorista 99</a>
      <a href="admin.html" class="tab-btn"><i class="fa-solid fa-gears" style="color: #ff9e00;"></i> Painel Admin 99</a>
    </nav>
  </header>

  <main class="main-container mode-single" id="mainLayout">

    <section class="app-panel passenger-panel" id="panelPassenger">
      <div class="panel-header">
        <h2><i class="fa-solid fa-location-dot" style="color: #ff9e00;"></i> 99Pop, 99Moto, 99Comfort & 99Entrega</h2>
        <div class="header-actions">
          <button id="btnOpenModalPassenger" class="btn-primary btn-sm" onclick="document.getElementById('modalRegisterPassenger').classList.remove('hidden')"><i class="fa-solid fa-user-plus"></i> + Perfil do Cliente</button>
          <span class="status-chip" id="passengerStatus">Pronto para viajar 99</span>
        </div>
      </div>

      <div class="map-wrap">
        <div id="mapPassenger" class="map-container"></div>

        <div class="map-controls-floating">
          <div class="input-group">
            <span class="icon" style="color: #10b981;">🟢</span>
            <input type="text" id="inputOrigin" placeholder="Sua localização atual..." value="MASP - Av. Paulista">
            <div id="suggestionsOrigin" class="autocomplete-dropdown hidden"></div>
          </div>

          <div class="input-group">
            <span class="icon" style="color: #ef4444;">🔴</span>
            <input type="text" id="inputDestination" placeholder="Para onde você quer ir?">
            <div id="suggestionsDest" class="autocomplete-dropdown hidden"></div>
          </div>

          <div class="quick-chips">
            <button class="chip-btn" onclick="document.getElementById('inputDestination').value='Parque Ibirapuera'; document.getElementById('btnCalculateFare').click();">🌳 Ibirapuera</button>
            <button class="chip-btn" onclick="document.getElementById('inputDestination').value='Aeroporto de Congonhas'; document.getElementById('btnCalculateFare').click();">✈️ Congonhas</button>
            <button class="chip-btn" onclick="document.getElementById('inputDestination').value='Praça da Sé - Centro'; document.getElementById('btnCalculateFare').click();">📍 Praça da Sé</button>
          </div>

          <button id="btnCalculateFare" class="btn-primary full-width">
            <i class="fa-solid fa-calculator"></i> Calcular Estimativa de Tarifa 99
          </button>
        </div>
      </div>

      <!-- CARD ESTIMATIVA DE CATEGORIAS -->
      <div id="cardBooking" class="booking-card hidden" style="background: #fffdf5; border: 2px solid #fde68a; border-radius: 14px; padding: 16px;">
        <h3 style="font-size: 1.05rem; font-weight: 800; color: #111827; margin-bottom: 12px;">Selecione a Categoria 99:</h3>

        <div id="categoriesGrid" class="categories-grid" style="margin-bottom: 14px;"></div>

        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 14px;">
          <label style="font-weight: 700; font-size: 0.85rem; color: #111827;">Forma de Pagamento:</label>
          <select id="selectPayment" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #fde68a; font-weight: 700;">
            <option value="pix">⚡ PIX</option>
            <option value="credit_card">💳 Cartão 99</option>
            <option value="cash">💵 Dinheiro ao Motorista</option>
          </select>
        </div>

        <button id="btnRequestRide" onclick="window.handleRequestRideSubmit()" class="btn-primary full-width" style="padding: 14px; font-size: 1rem; font-weight: 800;">
          🚀 SOLICITAR VIAGEM 99
        </button>
      </div>
    </section>

  </main>

  <!-- MODAL CADASTRO DE NOVO PASSAGEIRO -->
  <div class="modal-overlay hidden" id="modalRegisterPassenger">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-user-plus"></i> Cadastrar Perfil de Cliente 99</h3>
        <button class="btn-close" onclick="document.getElementById('modalRegisterPassenger').classList.add('hidden')">&times;</button>
      </div>
      <form id="formRegisterPassenger" class="modal-form" onsubmit="event.preventDefault(); window.handlePassengerRegisterSubmit(event); return false;">
        <div class="form-group">
          <label>Seu Nome Completo:</label>
          <input type="text" id="regPassengerName" placeholder="Ex: Maria Santos" required>
        </div>
        <div class="form-group">
          <label>Telefone / WhatsApp:</label>
          <input type="text" id="regPassengerPhone" placeholder="(11) 98888-7777" required>
        </div>
        <div class="form-group">
          <label>Forma de Pagamento Preferida:</label>
          <select id="regPassengerPay">
            <option value="pix">⚡ PIX</option>
            <option value="credit_card">💳 Cartão 99</option>
            <option value="cash">💵 Dinheiro ao Motorista</option>
          </select>
        </div>
        <button type="button" onclick="window.handlePassengerRegisterSubmit(event)" class="btn-primary full-width" style="padding: 14px; font-weight: 800;">
          <i class="fa-solid fa-user-check"></i> Criar Perfil de Cliente 99
        </button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js?v=3.0"></script>
</body>
</html>
